<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Word Guessing Game</title>
    <link href="wordle_clone.css" rel="stylesheet">
</head>
<body>
    <div id="container">
        <h1>Word Guessing Game</h1>
        <p>Try to guess the hidden word in 6 tries.</p>
        <p>Enter to guess. Backspace to delete the last letter.</p>
        <p>Type a word to begin.</p>
        <div id="gameBoard">
            <div class="row" id="row0">
            </div>
            <div class="row" id="row1">
            </div>
            <div class="row" id="row2">
            </div>
            <div class="row" id="row3">
            </div>
            <div class="row" id="row4">
            </div>
            <div class="row" id="row5">
            </div>
        </div>
        <h2 id="statusMsg">Game in progress</h2>
        <button id="restartBtn">Restart</button>

        <script src="wordle_clone.js"></script>
    </div>
</body>
</html>
